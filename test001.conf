# ======= 重写规则 ======= #

# 注意：
# 1. 这是 QX 的“重写引用文件”格式。
# 2. hostname 必须保持为一条逻辑配置。
# 3. 如果把这些内容写入主配置，hostname 必须放在 [mitm] 段中。

hostname = api.zhihu.com, zhuanlan.zhihu.com, m-cloud.zhihu.com, appcloud.zhihu.com, appcloud2.zhihu.com, appcloud2.in.zhihu.com, duga.zhihu.com, apm.zhihu.com, pic*.zhimg.com, pgdt.ugdtimg.com, umeng.com, *.umeng.com, umengcloud.com, *.umengcloud.com, volceapplog.com, *.volceapplog.com, open.kuaishouzt.com, getui.com, *.getui.com, pv.sohu.com, vzuu.com, *.vzuu.com, zhihu-web-analytics.zhihu.com, httpdns.kwd.inkuai.com, crash2.zhihu.com, httpdns.alicdn.com, open.kwaizt.com, page-modular.zhihu.com, www.zhihu.com, miaozhen.com, *.miaozhen.com, uyunad.com, *.uyunad.com, h5.m.goofish.com, bdlog.tanx.com, h-adashx.ut.taobao.com, flowplus.meituan.net, s3plus.meituan.net, storage.360buyimg.com


# ======= 知乎 ======= #

# 商业广告接口
^https?:\/\/api\.zhihu\.com\/commercial_api(?:\/|\?|$) url reject

# 以下三条范围较大，可能影响正常内容或配置加载
^https?:\/\/zhuanlan\.zhihu\.com\/ url reject
^https?:\/\/m-cloud\.zhihu\.com\/ url reject
^https?:\/\/appcloud2(?:\.in)?\.zhihu\.com\/ url reject

# 知乎其他广告或配置域名
^https?:\/\/duga\.zhihu\.com\/ url reject

# APM、崩溃和分析上报
^https?:\/\/apm\.zhihu\.com\/ url reject
^https?:\/\/crash2\.zhihu\.com\/api\/15(?:\/|\?|$) url reject
^https?:\/\/zhihu-web-analytics\.zhihu\.com\/ url reject
^https?:\/\/www\.zhihu\.com\/sc-profiler-zhapp(?:\/|\?|$) url reject-200

# 上传设备信息
^https?:\/\/appcloud\.zhihu\.com\/v1\/device(?:\/|\?|$) url reject-200

# 屏蔽知乎图片
# 注意：会屏蔽正常文章图、头像等，不只是广告图
^https?:\/\/pic\d*\.zhimg\.com\/ url reject

# 通知设置接口
# 注意：可能导致知乎通知设置页面异常
^https?:\/\/api\.zhihu\.com\/settings\/new\/notification(?:\/|\?|$) url reject

# 事件上报
^https?:\/\/api\.zhihu\.com\/zst\/events\/s(?:\/|\?|$) url reject

# 市场和电商接口
^https?:\/\/api\.zhihu\.com\/market(?:\/|\?|$) url reject
^https?:\/\/api\.zhihu\.com\/api\/v4\/ecom_data(?:\/|\?|$) url reject

# 个人主页“我的”图标接口
^https?:\/\/api\.zhihu\.com\/people\/homepage_mine_icon(?:\/|\?|$) url reject

# 页面模块配置
^https?:\/\/page-modular\.zhihu\.com\/ url reject

# 知乎视频域名
# 注意：会影响正常知乎视频
^https?:\/\/(?:[^\/]+\.)?vzuu\.com\/ url reject

# 知乎使用的 HTTPDNS
^https?:\/\/httpdns\.kwd\.inkuai\.com\/ url reject


# ======= 腾讯广告资源 ======= #

^https?:\/\/pgdt\.ugdtimg\.com\/ url reject


# ======= 友盟 ======= #

# 全量阻断友盟域名
# 注意：可能影响部分 App 的统计、推送和远程配置
^https?:\/\/(?:[^\/]+\.)?umeng\.com\/ url reject
^https?:\/\/(?:[^\/]+\.)?umengcloud\.com\/ url reject


# ======= UYUN 广告 ======= #

^https?:\/\/(?:[^\/]+\.)?uyunad\.com\/ url reject


# ======= 字节日志和实验配置 ======= #

# 包含日志上报、AB 实验等接口
^https?:\/\/(?:[^\/]+\.)?volceapplog\.com\/ url reject


# ======= 快手 ======= #

^https?:\/\/open\.kuaishouzt\.com\/ url reject


# ======= 个推 ======= #

# 注意：阻断个推可能导致使用个推的 App 无法收到推送
^https?:\/\/(?:[^\/]+\.)?getui\.com\/ url reject


# ======= 搜狐统计 ======= #

^https?:\/\/pv\.sohu\.com\/ url reject


# ======= 秒针统计 ======= #

^https?:\/\/(?:[^\/]+\.)?miaozhen\.com\/ url reject


# ======= 测试中的接口 ======= #

# 目前处于启用状态，不是注释状态
^https?:\/\/httpdns\.alicdn\.com\/ url reject
^https?:\/\/open\.kwaizt\.com\/ url reject


# ======= 闲鱼 ======= #

# 广告曝光
^https?:\/\/bdlog\.tanx\.com\/imp(?:\/|\?|$) url reject-200

# 首页浮动球
^https?:\/\/h5\.m\.goofish\.com\/app\/idleFish-F2e\/idlefish-pop-h5\/homecommonfloatball\.html(?:\?|$) url reject-200

# 阿里数据上报
^https?:\/\/h-adashx\.ut\.taobao\.com\/upload(?:\/|\?|$) url reject-200


# ======= 美团 ======= #

# Linglong 广告素材
# 支持文件名含连字符，不再局限于纯字母、数字和下划线
^https?:\/\/(?:s3plus|flowplus)\.meituan\.net\/v\d+\/[^\/]+\/linglong\/[^\/]+\.(?:gif|jpe?g|mp4)(?:\?.*)?$ url reject


# ======= 京东 ======= #

# 京东 XView 三秒推广浮层
# 抓包确认：
# - 返回推广主图和活动落地页
# - 包含关闭按钮
# - showDuration = 3
#
# 影响范围：
# 会阻止 storage.360buyimg.com/xview/ 下的所有京东 XView 推广模板，
# 不仅限于当前“商超”这一张，但不会屏蔽普通商品图片。
^https:\/\/storage\.360buyimg\.com\/xview\/ url reject-dict
