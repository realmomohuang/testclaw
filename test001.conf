# ======= 重写规则 ======= #

# 注意：
# 1. 这是 Quantumult X 的重写引用文件格式。
# 2. hostname 必须保持为一条逻辑配置。
# 3. 写入主配置时，hostname 合并到 [mitm]，其余规则放入 [rewrite_local]。
# 4. QX 只需要引用本文件，知乎脚本由下面的 Raw 地址自动加载。

hostname = api.zhihu.com, www.zhihu.com, duga.zhihu.com, apm.zhihu.com, zhihu-web-analytics.zhihu.com, crash2.zhihu.com, datahub.zhihu.com, storage.360buyimg.com, flowplus.meituan.net, s3plus.meituan.net, pgdt.ugdtimg.com, miaozhen.com, *.miaozhen.com, uyunad.com, *.uyunad.com, umeng.com, *.umeng.com, umengcloud.com, *.umengcloud.com, volceapplog.com, *.volceapplog.com, getui.com, *.getui.com, pv.sohu.com, bdlog.tanx.com, h5.m.goofish.com, h-adashx.ut.taobao.com


# ======= 知乎：我的页面 ======= #

# 删除“开通知识会员”卡片
^https:\/\/api\.zhihu\.com\/kvip\/right\/my_card(?:\?.*)?$ url reject-dict

# 删除整个功能入口宫格
# 包括：书架、课程、钱包、付费咨询、福利社、商城、
# 帮助与客服、AI Works、圈子、打卡挑战
^https:\/\/api\.zhihu\.com\/people\/homepage_entry_v2(?:\?.*)?$ url reject-dict

# 保留“推荐问题”
# 删除创作灵感、创作打卡瓜分和其他活动功能
^https:\/\/www\.zhihu\.com\/api\/v4\/members\/homepage_card(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/realmomohuang/appletuisong/main/zhihu_clean.js


# ======= 知乎：首页顶栏 ======= #

# 只保留：关注、推荐、热榜
# 删除：故事、直播、本地频道
^https:\/\/api\.zhihu\.com\/root\/tab\/v2(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/realmomohuang/appletuisong/main/zhihu_clean.js


# ======= 知乎：广告与推广 ======= #

# 浮层广告、二楼广告、下拉刷新广告、首页横幅和启动配置
^https:\/\/api\.zhihu\.com\/commercial_api\/(?:app_float_layer|real_time_second_floor_v2|real_time_pull_refresh_v2|banners_v3\/app_topstory_banner|launch_v2)(?:\?.*)?$ url reject-dict

# 市场推广弹窗
^https:\/\/api\.zhihu\.com\/market\/popovers_v2(?:\?.*)?$ url reject-dict

# 电商配置
^https:\/\/api\.zhihu\.com\/api\/v4\/ecom_data\/config(?:\?.*)?$ url reject-dict

# 活动推荐浮窗
^https:\/\/api\.zhihu\.com\/event-center\/recommend\/window(?:\?.*)?$ url reject-dict

# 我的页面引导
^https:\/\/api\.zhihu\.com\/me\/guides(?:\?.*)?$ url reject-dict


# ======= 知乎：统计与崩溃上报 ======= #

# 事件上报
^https:\/\/api\.zhihu\.com\/zst\/events\/(?:i|p|s)(?:\?.*)?$ url reject-200

# 行为日志
^https:\/\/duga\.zhihu\.com\/(?:api\/.*\/za\/logs\/batch|client\/ios_funnel_v3)(?:\?.*)?$ url reject-200

# APM 性能上报
^https:\/\/apm\.zhihu\.com\/collector\/apm(?:\?.*)?$ url reject-200

# 网页分析
^https:\/\/zhihu-web-analytics\.zhihu\.com\/.* url reject-200

# 崩溃上报
^https:\/\/crash2\.zhihu\.com\/api\/\d+\/(?:envelope\/)?(?:\?.*)?$ url reject-200

# 数据采集
^https:\/\/datahub\.zhihu\.com\/collector\/(?:zlab|zalocation)(?:\?.*)?$ url reject-200

# 页面性能分析
^https:\/\/www\.zhihu\.com\/sc-profiler(?:-zhapp)?(?:\?.*)?$ url reject-200


# ======= 京东 ======= #

# 京东 XView 三秒启动推广
# 抓包确认：
# 1. 返回推广主图和活动落地页
# 2. 包含关闭按钮
# 3. showDuration = 3
#
# 只阻止 XView 推广模板，不屏蔽普通商品图片
^https:\/\/storage\.360buyimg\.com\/xview\/.*\.json(?:\?.*)?$ url reject-dict


# ======= 美团 ======= #

# Linglong 开屏广告素材
# 支持 gif、jpg、jpeg、mp4 和包含连字符的文件名
# 只拦截对应素材，不封锁整个美团 CDN
^https?:\/\/(?:s3plus|flowplus)\.meituan\.net\/v\d+\/[^\/]+\/linglong\/[^\/?]+\.(?:gif|jpe?g|mp4)(?:\?.*)?$ url reject


# ======= 腾讯广告资源 ======= #

^https?:\/\/pgdt\.ugdtimg\.com\/.* url reject


# ======= 友盟统计 ======= #

# 可能影响部分 App 的统计、推送和远程配置
^https?:\/\/(?:[^\/]+\.)?umeng\.com\/.* url reject-200
^https?:\/\/(?:[^\/]+\.)?umengcloud\.com\/.* url reject-200


# ======= UYUN 广告 ======= #

^https?:\/\/(?:[^\/]+\.)?uyunad\.com(?:\/.*)?$ url reject-200


# ======= 字节日志和实验配置 ======= #

# 包含日志上报和 AB 实验接口
^https?:\/\/(?:[^\/]+\.)?volceapplog\.com\/.* url reject-200


# ======= 个推 ======= #

# 会影响使用个推 SDK 的 App 通知推送
# 如果需要正常接收这些 App 的推送，注释下面这条
^https?:\/\/(?:[^\/]+\.)?getui\.com\/.* url reject-200


# ======= 搜狐统计 ======= #

^https?:\/\/pv\.sohu\.com\/.* url reject-200


# ======= 秒针统计 ======= #

^https?:\/\/(?:[^\/]+\.)?miaozhen\.com\/.* url reject-200


# ======= 闲鱼 ======= #

# 广告曝光
^https?:\/\/bdlog\.tanx\.com\/imp(?:\/|\?|$) url reject-200

# 首页浮动球
^https?:\/\/h5\.m\.goofish\.com\/app\/idleFish-F2e\/idlefish-pop-h5\/homecommonfloatball\.html(?:\?.*)?$ url reject-200

# 阿里数据上报
^https?:\/\/h-adashx\.ut\.taobao\.com\/upload(?:\/|\?|$) url reject-200
